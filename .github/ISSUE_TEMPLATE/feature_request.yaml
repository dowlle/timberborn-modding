name: Feature request or idea
description: A new check, item, option, goal or quality-of-life change.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome and several shipped features started as one. The questions below
        are the ones that get asked in the comments every time, so answering them up front
        gets the idea triaged in one pass instead of three.

        Not knowing an answer is fine. Leave it blank.

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like added or changed.
      placeholder: A check the first time each good is produced, so early production pulls you forward.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What would it add to play?
      description: |
        What problem it solves, or what it would feel like in a colony. This is what
        decides whether an idea gets adopted, more than the mechanism does.
    validations:
      required: true

  - type: textarea
    id: prior-art
    attributes:
      label: Does another randomizer or Archipelago world already do this?
      description: |
        Genuinely useful, not a formality. Naming a world that does it well has settled
        several design questions in one comment.
    validations:
      required: false

  - type: dropdown
    id: optional
    attributes:
      label: Should this be optional?
      description: |
        Almost every accepted idea ends up as a YAML option, and the default matters.
        Anything that changes the item or location pool is normally off by default.
      options:
        - Not sure
        - A YAML option, off by default
        - A YAML option, on by default
        - Always on, no option
    validations:
      required: false

  - type: dropdown
    id: faction
    attributes:
      label: Does this apply to both factions?
      description: |
        Folktails and Iron Teeth have different buildings and production chains, so an
        idea that only works for one is a different, smaller piece of work.
      options:
        - Both
        - Folktails only
        - Iron Teeth only
        - Not sure
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which half would this touch, if you know?
      description: |
        The APWorld decides what the randomizer does, the Unity mod decides what the game
        does. Guessing wrong costs nothing, this just helps route it.
      options:
        - Not sure
        - The in-game mod (shop, panel, display, behaviour)
        - The APWorld (checks, items, options, logic, goals)
    validations:
      required: false
